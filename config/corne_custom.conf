# P0.09 / P0.10 are NFC antenna pins by default on the nRF52840, so any key
# wired to them is dead until NFC is disabled. This build uses them for rows
# (left 009+010, right 010), so free them for GPIO use.
CONFIG_NFCT_PINS_AS_GPIO=y

# Optional: reset held-key state cleanly on disconnect
CONFIG_ZMK_SLEEP=y
